name: Gitwo smoke tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  shell-and-providers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Shell and provider regression
        run: bash gitwo/test-all.sh
      - name: Installed CLI and checksum validation
        run: bash test-installer.sh
