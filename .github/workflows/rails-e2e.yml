name: Gitwo Rails E2E

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rails-postgres-redis:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gitwo_ci
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gitwo_ci -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.14'
      - uses: jdx/mise-action@v4
        with:
          install: false
          cache: true
      - name: Install database and Redis clients
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client redis-server redis-tools
      - name: Test real Rails workspace lifecycle
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: gitwo_ci
          PGPASSWORD: local_ci_only
          GITWO_DB_HOST: 127.0.0.1
          GITWO_DB_PORT: '5432'
          GITWO_DB_USER: gitwo_ci
          GITWO_PROXY: none
          GITWO_BOOTSTRAP: schema
          RAILS_ENV: development
        run: bash tests/e2e/rails-postgres.sh
